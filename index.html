<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HaTormus - Building Dashboard</title>

    <!--
        גרסת "Premium" של הדשבורד - HTML + Tailwind + Lucide בקובץ אחד.
        כל הלוגיקה הקיימת (מנוי, אדמין, רדיו, Ynet, רענון אוטומטי, סקייל למסך)
        נטענת מאותם קבצי JS כמו קודם ולא שונתה; הקובץ הזה מחליף רק את התצוגה:
        design_improved.css + הסקריפטים שבנו HTML (weather / Event / notices /
        building_status / theme_picker) מוחלפים כאן בגרסאות inline.

        רענון אוטומטי כל 4 שעות - auto_refresh.js (ולא meta refresh), כדי שאפשר
        יהיה להשהות אותו כשחלון הניהול פתוח.
    -->

    <!-- גופנים: Inter (ספרות ולטינית) + Heebo (עברית) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- חלון הניהול (admin_panel.js) ומסך חידוש המנוי ממשיכים להשתמש ב-Material
         Symbols, ובוחר האייקונים של סטטוס הבניין עובד עם שמות Font Awesome -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Lucide icons -->
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

    <style>
        /* ═══════════════════════════════════════════
           1. ערכות צבעים
           ערוצי RGB (בלי rgb()) כדי ש-Tailwind יוכל להוסיף שקיפות: bg-card/60
           הבסיס כהה ועמוק; צבע ההדגשה (accent) משמש רק להדגשות, גבולות
           פעילים ואינדיקטורים ראשיים.
        ════════════════════════════════════════════ */
        :root, body.theme-gold {
            --c-canvas: 9 9 11;        /* zinc-950 */
            --c-card:   24 24 27;      /* zinc-900 */
            --c-raise:  39 39 42;      /* zinc-800 */
            --c-line:   48 48 54;
            --c-ink:    244 244 245;
            --c-muted:  161 161 170;
            --c-faint:  113 113 122;
            --c-accent: 212 168 75;    /* זהב */
            --c-good:   52 211 153;
            --c-warn:   251 191 36;
            --c-bad:    251 113 133;
        }
        body.theme-royal {
            --c-canvas: 2 6 23;        /* slate-950 */
            --c-card:   15 23 42;      /* slate-900 */
            --c-raise:  30 41 59;
            --c-line:   38 50 70;
            --c-ink:    241 245 249;
            --c-muted:  148 163 184;
            --c-faint:  100 116 139;
            --c-accent: 110 168 255;
        }
        /* גרפיט וליים - פחם ניטרלי עם הדגשה בירוק-ליים חשמלי */
        body.theme-lime {
            --c-canvas: 10 11 10;
            --c-card:   22 24 22;
            --c-raise:  35 38 35;
            --c-line:   48 52 47;
            --c-ink:    242 245 240;
            --c-muted:  156 163 152;
            --c-faint:  108 115 104;
            --c-accent: 190 242 100;
            --c-good:   45 212 191;
        }
        body.theme-petrol {
            --c-canvas: 3 12 15;
            --c-card:   12 26 31;
            --c-raise:  22 40 46;
            --c-line:   30 52 59;
            --c-ink:    236 246 248;
            --c-muted:  142 168 175;
            --c-faint:  96 122 129;
            --c-accent: 53 196 216;
        }
        /* בוקר נורדי - לבן קריר-תכלכל, נקי וחד, הדגשה בכחול עז (ערכה בהירה) */
        body.theme-nordic {
            --c-canvas: 236 241 247;
            --c-card:   255 255 255;
            --c-raise:  240 244 249;
            --c-line:   212 221 232;
            --c-ink:    15 23 42;
            --c-muted:  71 85 105;
            --c-faint:  100 116 139;
            --c-accent: 37 99 235;
            --c-good:   21 128 61;
            --c-warn:   180 83 9;
            --c-bad:    220 38 38;
        }
        /* חול וטרקוטה - קרם חמים עם הדגשה בכתום שרוף, רך לעין באור יום (ערכה בהירה) */
        body.theme-sand {
            --c-canvas: 244 239 229;
            --c-card:   255 252 246;
            --c-raise:  240 233 220;
            --c-line:   222 211 192;
            --c-ink:    41 35 28;
            --c-muted:  107 96 82;
            --c-faint:  140 128 112;
            --c-accent: 186 82 44;
            --c-good:   22 120 70;
            --c-warn:   150 100 0;
            --c-bad:    200 40 40;
        }
        /* מצב יום - שמש חזקה: בהיר, ניגודיות גבוהה */
        body.theme-day {
            --c-canvas: 241 242 245;
            --c-card:   255 255 255;
            --c-raise:  236 238 242;
            --c-line:   206 211 219;
            --c-ink:    9 11 15;
            --c-muted:  63 71 82;
            --c-faint:  98 107 120;
            --c-accent: 217 119 6;
            --c-good:   21 128 61;
            --c-warn:   180 83 9;
            --c-bad:    220 38 38;
        }

        /* משתנים בשמות הישנים - חלון הניהול (CSS בסוף הקובץ) נשען עליהם */
        :root, body {
            --gold:        rgb(var(--c-accent));
            --gold-light:  rgb(var(--c-accent) / 0.14);
            --gold-dim:    rgb(var(--c-accent));
            --blue:        rgb(var(--c-muted));
            --blue-light:  rgb(var(--c-raise));
            --green:       rgb(var(--c-good));
            --green-light: rgb(var(--c-good) / 0.12);
            --red:         rgb(var(--c-bad));
            --bg:          rgb(var(--c-canvas));
            --surface:     rgb(var(--c-card));
            --surface-2:   rgb(var(--c-raise));
            --border:      rgb(var(--c-line));
            --text:        rgb(var(--c-ink));
            --text-muted:  rgb(var(--c-muted));
            --text-faint:  rgb(var(--c-faint));
            --r-sm: 12px;
            --r-md: 16px;
            --r-lg: 24px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.12);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.25);
            --shadow-lg: 0 24px 60px rgba(0,0,0,0.45);
            --bar-height: 48px;
        }

        /* ═══════════════════════════════════════════
           2. בסיס + קנבס 1280x720 (stage_scale.js)
        ════════════════════════════════════════════ */
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: rgb(var(--c-canvas));
            color: rgb(var(--c-ink));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #tv-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;
            height: 720px;
            transform-origin: 0 0;
            overflow: hidden;
            /* תאורת אווירה עדינה בצבע ההדגשה */
            background:
                radial-gradient(900px 500px at 100% -10%, rgb(var(--c-accent) / 0.10), transparent 60%),
                radial-gradient(700px 500px at -10% 110%, rgb(var(--c-accent) / 0.06), transparent 60%),
                rgb(var(--c-canvas));
        }
        .tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "cv11" 1; }

        .glass {
            background: rgb(var(--c-card) / 0.6);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgb(var(--c-line) / 0.8);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4), inset 0 1px 0 rgb(255 255 255 / 0.03);
        }
        body:not(.dark-mode) .glass {
            background: rgb(var(--c-card) / 0.85);
            box-shadow: 0 20px 40px -16px rgb(15 23 42 / 0.18);
        }

        /* אייקון בריבוע רך */
        .icon-tile {
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 12px;
            transition: all 300ms ease;
        }

        /* ═══════════════════════════════════════════
           3. הודעות ועד בית - גלילה אוטומטית רק כשיש גלישה
        ════════════════════════════════════════════ */
        .notices-track {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .notices-track.is-scrolling {
            animation: notices-scroll linear infinite;
            animation-duration: var(--notices-scroll-duration, 20s);
        }
        .notices-track.is-scrolling:hover { animation-play-state: paused; }
        @keyframes notices-scroll {
            0%   { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }
        #notices-list.has-scroll {
            -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 22px), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 22px), transparent 100%);
        }

        /* ═══════════════════════════════════════════
           4. נגן המוזיקה - radio_script.js מחליף רק classes
              (האייקון הטקסטואלי #radio-icon מוסתר; play/pause מוחלפים ב-CSS)
        ════════════════════════════════════════════ */
        .radio-bar .ico-pause { display: none; }
        .radio-bar.is-playing .ico-play { display: none; }
        .radio-bar.is-playing .ico-pause { display: block; }
        .radio-bar.is-playing {
            border-color: rgb(var(--c-accent) / 0.45);
            background: rgb(var(--c-accent) / 0.06);
        }
        .radio-bar.is-playing .radio-icon-wrap {
            background: rgb(var(--c-accent));
            border-color: rgb(var(--c-accent));
            color: rgb(var(--c-canvas));
            box-shadow: 0 0 0 4px rgb(var(--c-accent) / 0.15);
        }
        .radio-bars span {
            width: 3px;
            height: 4px;
            border-radius: 2px;
            background: rgb(var(--c-accent));
            opacity: 0.3;
        }
        .radio-bar.is-playing .radio-bars span {
            opacity: 1;
            animation: radio-bounce 0.9s ease-in-out infinite;
        }
        .radio-bar.is-playing .radio-bars span:nth-child(2) { animation-delay: 0.2s; }
        .radio-bar.is-playing .radio-bars span:nth-child(3) { animation-delay: 0.4s; }
        .radio-bar.is-playing .radio-bars span:nth-child(4) { animation-delay: 0.1s; }
        .radio-bar.is-reconnecting .radio-bars span { animation: none; opacity: 0.3; }
        .radio-bar.is-reconnecting #radio-label { color: rgb(var(--c-warn)); }
        @keyframes radio-bounce {
            0%, 100% { height: 4px; }
            50%      { height: 14px; }
        }
        .radio-source-chip.is-selected {
            background: rgb(var(--c-accent) / 0.16);
            color: rgb(var(--c-accent));
            box-shadow: inset 0 0 0 1px rgb(var(--c-accent) / 0.35);
        }

        /* ═══════════════════════════════════════════
           5. חלון התמונה (side_image_script.js)
        ════════════════════════════════════════════ */
        .side-image-window { display: none; }
        .side-image-window.is-visible { display: flex; }
        .side-image-window img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #image-toggle-btn .ico-hide { display: none; }
        #image-toggle-btn.is-on .ico-show { display: none; }
        #image-toggle-btn.is-on .ico-hide { display: block; }
        #image-toggle-btn.is-on {
            color: rgb(var(--c-accent));
            border-color: rgb(var(--c-accent) / 0.4);
            background: rgb(var(--c-accent) / 0.1);
        }
        #image-toggle-btn.is-locked { opacity: 0.45; cursor: default; }

        /* ═══════════════════════════════════════════
           6. בר החדשות - Ynet_script.js בונה .ticker-item / .ticker-time / .separator
        ════════════════════════════════════════════ */
        .ticker-container {
            -webkit-mask-image: linear-gradient(to left, transparent 0, #000 40px, #000 calc(100% - 64px), transparent 100%);
            mask-image: linear-gradient(to left, transparent 0, #000 40px, #000 calc(100% - 64px), transparent 100%);
        }
        .ticker-track {
            display: flex;
            align-items: center;
            white-space: nowrap;
            animation: marquee var(--ticker-speed, 180s) linear infinite;
            will-change: transform;
        }
        .ticker-track:hover { animation-play-state: paused; }
        @keyframes marquee {
            0%   { transform: translateX(0); }
            100% { transform: translateX(50%); }
        }
        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            color: rgb(var(--c-ink) / 0.9);
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: color 300ms ease;
        }
        .ticker-item:hover { color: rgb(var(--c-accent)); }
        .ticker-time {
            font-family: Inter, sans-serif;
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            font-weight: 600;
            color: rgb(var(--c-muted));
            padding: 2px 8px;
            border-radius: 6px;
            background: rgb(var(--c-ink) / 0.05);
            border: 1px solid rgb(var(--c-line) / 0.8);
        }
        .separator {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgb(var(--c-faint) / 0.6);
            font-size: 0;
            flex-shrink: 0;
        }
        #status-msg { padding: 0 20px; font-size: 13px; color: rgb(var(--c-muted)); }
        #status-msg:empty { display: none; }
        .live-dot::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: inherit;
            animation: live-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes live-ping {
            75%, 100% { transform: scale(2.4); opacity: 0; }
        }

        /* ═══════════════════════════════════════════
           7. בוחר ערכת צבעים
        ════════════════════════════════════════════ */
        #theme-picker-panel {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.97);
            transform-origin: top left;
            transition: opacity 250ms ease, transform 250ms cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 250ms;
        }
        #theme-picker-panel.is-open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            transition: opacity 250ms ease, transform 250ms cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s;
        }
        .theme-radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1.5px solid rgb(var(--c-line));
            display: grid;
            place-items: center;
            transition: all 300ms ease;
        }
        .theme-radio::after {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgb(var(--c-accent));
            transform: scale(0);
            transition: transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .theme-swatch-row.is-selected .theme-radio {
            border-color: rgb(var(--c-accent));
            box-shadow: 0 0 0 4px rgb(var(--c-accent) / 0.15);
        }
        .theme-swatch-row.is-selected .theme-radio::after { transform: scale(1); }
        .theme-swatch-row.is-selected {
            background: rgb(var(--c-ink) / 0.05);
            border-color: rgb(var(--c-accent) / 0.35);
        }

        /* ═══════════════════════════════════════════
           7ב. קודי QR - קוד אחד: שורה אופקית; 2-3 קודים: אריחים זה לצד זה
        ════════════════════════════════════════════ */
        .qr-grid { display: grid; gap: 10px; }
        .qr-tile {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgb(var(--c-line) / 0.8);
            background: rgb(var(--c-ink) / 0.03);
            transition: all 300ms ease;
        }
        .qr-tile:hover { border-color: rgb(var(--c-accent) / 0.4); }
        .qr-img {
            flex-shrink: 0;
            padding: 5px;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
        }
        .qr-img img, .qr-img svg { display: block; width: 52px; height: 52px; }
        .qr-label { font-size: 14px; font-weight: 600; color: rgb(var(--c-ink)); line-height: 1.3; }
        .qr-sub {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 2px;
            font-size: 12px;
            color: rgb(var(--c-muted));
        }
        .qr-sub svg { width: 13px; height: 13px; }
        /* כמה קודים - אריח אנכי וקומפקטי */
        .qr-grid.is-multi .qr-tile {
            flex-direction: column;
            gap: 8px;
            padding: 10px 6px 9px;
            text-align: center;
        }
        .qr-grid.is-multi .qr-label {
            font-size: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .qr-grid.is-multi .qr-sub { display: none; }

        /* ═══════════════════════════════════════════
           8. כפתור המנעול (admin_panel.js מחווט את #admin-btn)
        ════════════════════════════════════════════ */
        body.admin-open #tv-stage { filter: blur(2px); }

        /* ═══════════════════════════════════════════
           9. חלון הניהול - הועתק מ-design_improved.css (סעיפים 13ב-13ח)
              ונשען על משתני התאימות שבסעיף 1
        ════════════════════════════════════════════ */
/* --- 13ב. שכבת הכהות + מסגרת החלון --- */
.admin-root {
    position: fixed;
    inset: 0;
    z-index: 5000;
    display: none;
    direction: rtl;
    font-family: 'Heebo', system-ui, sans-serif;
}
.admin-root.is-open { display: block; }

.admin-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(2px);
}

.admin-modal {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(560px, calc(100vw - 24px));
    max-height: min(680px, calc(100vh - 24px));
    display: flex;
    flex-direction: column;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
}

.admin-modal-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    flex-shrink: 0;
}
.admin-modal-head > .material-symbols-outlined {
    font-size: 22px;
    color: var(--gold);
}
.admin-modal-title {
    margin: 0;
    font-size: 1rem;
    font-weight: 800;
    color: var(--text);
}
.admin-close {
    margin-inline-start: auto;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
}
.admin-close:hover { background: var(--border); color: var(--text); }
.admin-close .material-symbols-outlined { font-size: 20px; }

.admin-modal-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 18px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
}

.admin-modal-foot {
    flex-shrink: 0;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.admin-foot-main  { display: flex; gap: 8px; }
.admin-foot-extra {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    border-top: 1px dashed var(--border);
    padding-top: 10px;
}

/* --- 13ג. כפתורים --- */
.admin-btn {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
}
.admin-btn.admin-btn-primary {
    background: var(--gold);
    border-color: var(--gold);
    color: #fff;
}
.admin-btn.admin-btn-primary:hover { opacity: 0.88; }
.admin-btn.admin-btn-ghost:hover { background: var(--border); }

.admin-btn-sm {
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, opacity 0.15s;
}
.admin-btn-sm.admin-btn-ghost:hover { background: var(--border); color: var(--text); }
.admin-btn-sm.admin-btn-danger {
    background: var(--red);
    color: #fff;
}
.admin-btn-sm.admin-btn-danger:hover { opacity: 0.88; }

.admin-icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s, opacity 0.15s;
}
.admin-icon-btn:hover:not(:disabled) { background: var(--border); color: var(--text); }
.admin-icon-btn:disabled { opacity: 0.3; cursor: default; }
.admin-icon-btn .material-symbols-outlined { font-size: 17px; }
.admin-icon-btn-danger:hover:not(:disabled) {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
}

/* --- 13ד. מסך ההתחברות --- */
.admin-login { padding: 10px 0 4px; }
.admin-login-text {
    margin: 0 0 14px;
    font-size: 0.88rem;
    line-height: 1.5;
    color: var(--text-muted);
}
.admin-login-input { text-align: center; font-size: 1.05rem; letter-spacing: 2px; }
.admin-login-error {
    margin-top: 8px;
    min-height: 18px;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--red);
    text-align: center;
}

/* --- 13ד1. אבחון הגדרות במסך ההתחברות ---
   אומר בדיוק באיזה שלב ההגדרה נתקעה (פונקציה לא פרוסה / חסר משתנה
   סביבה / אין רשת), במקום להשאיר את המשתמש לנחש */
.admin-diag-link {
    display: block;
    margin: 4px auto 0;
    padding: 4px 8px;
    border: none;
    background: none;
    color: var(--gold);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    text-decoration: underline;
    cursor: pointer;
}
.admin-diag {
    display: none;
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    background: var(--surface-2);
    font-size: 0.78rem;
    line-height: 1.45;
}
.admin-diag.is-open { display: block; }
.admin-diag-line {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    font-weight: 700;
    color: var(--text);
}
.admin-diag-line .material-symbols-outlined { font-size: 17px; flex-shrink: 0; }
.admin-diag-ok  .material-symbols-outlined { color: var(--green); }
.admin-diag-bad .material-symbols-outlined { color: var(--red); }
.admin-diag-hint {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    color: var(--text-muted);
    font-weight: 400;
}
.admin-diag-hint strong { color: var(--text); font-weight: 800; }

/* --- 13ד2. שורת מצב (מאיפה התוכן שמוצג, ומתי עודכן) ---
   זה מה שמונע את הבלבול "ערכתי ולא רואים את זה על הטלוויזיה" */
.admin-banner {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 10px 12px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    background: var(--surface-2);
    font-size: 0.78rem;
    font-weight: 700;
    line-height: 1.45;
    color: var(--text-muted);
}
.admin-banner .material-symbols-outlined {
    font-size: 18px;
    color: var(--green);
    flex-shrink: 0;
}
.admin-banner-warn {
    border-color: var(--red);
    color: var(--text);
}
.admin-banner-warn .material-symbols-outlined { color: var(--red); }

/* --- 13ה. לשוניות --- */
.admin-tabs {
    display: flex;
    gap: 6px;
    padding: 4px;
    margin-bottom: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
}
.admin-tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 8px;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.admin-tab:hover { color: var(--text); }
.admin-tab.is-active {
    background: var(--surface);
    border-color: var(--gold);
    color: var(--gold);
    box-shadow: var(--shadow-sm);
}
.admin-tab .material-symbols-outlined { font-size: 19px; }
.admin-tab-count {
    min-width: 20px;
    padding: 1px 6px;
    border-radius: 20px;
    background: var(--border);
    color: var(--text-muted);
    font-size: 0.72rem;
    font-weight: 800;
}
.admin-tab.is-active .admin-tab-count {
    background: var(--gold);
    color: #fff;
}

/* --- 13ו. כרטיסי העריכה --- */
.admin-list { display: flex; flex-direction: column; gap: 12px; }

.admin-empty {
    padding: 26px 14px;
    text-align: center;
    font-size: 0.86rem;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px dashed var(--border);
    border-radius: var(--r-md);
}

.admin-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-right: 4px solid var(--gold);
    border-radius: var(--r-md);
    padding: 12px 14px;
    transition: border-color 0.2s;
}
.admin-card.is-urgent { border-right-color: var(--red); }

.admin-card-head {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
}
.admin-card-title {
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--text-muted);
}
.admin-card-actions {
    margin-inline-start: auto;
    display: flex;
    gap: 5px;
}

.admin-field { margin-bottom: 10px; }
.admin-field:last-child { margin-bottom: 0; }
.admin-field-label {
    display: block;
    margin-bottom: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
}

.admin-input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    transition: border-color 0.15s, box-shadow 0.15s;
}
.admin-input:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-light);
}
.admin-input-sm { padding: 6px 9px; font-size: 0.82rem; }
.admin-textarea { resize: vertical; min-height: 56px; line-height: 1.45; }
.admin-select { cursor: pointer; }

.admin-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
}
.admin-check input { width: 16px; height: 16px; accent-color: var(--red); cursor: pointer; }

.admin-add-btn {
    width: 100%;
    margin-top: 12px;
    padding: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 1px dashed var(--border);
    border-radius: var(--r-md);
    background: transparent;
    color: var(--gold);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
}
.admin-add-btn:hover { background: var(--surface-2); border-color: var(--gold); }
.admin-add-btn .material-symbols-outlined { font-size: 20px; }

/* --- 13ז. בוחר האייקונים --- */
.admin-icon-preview {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.15s;
}
.admin-icon-preview:hover { border-color: var(--gold); }
.admin-icon-preview i { font-size: 17px; color: var(--gold); width: 20px; text-align: center; }
.admin-icon-preview-label { color: var(--text-muted); font-weight: 400; font-size: 0.8rem; }

.admin-icon-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
    gap: 6px;
    margin-top: 8px;
    padding: 10px;
    max-height: 230px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    background: var(--surface);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
}
.admin-icon-grid.is-open { display: grid; }

.admin-icon-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 3px;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    background: var(--surface-2);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.65rem;
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.admin-icon-cell i { font-size: 15px; }
.admin-icon-cell:hover { border-color: var(--gold); color: var(--text); }
.admin-icon-cell.is-selected {
    border-color: var(--gold);
    background: var(--gold-light);
    color: var(--gold);
}

.admin-icon-custom {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    flex-wrap: wrap;            /* במסך צר התווית והשדה יורדים לשתי שורות */
    gap: 6px 8px;
    padding-top: 8px;
    margin-top: 2px;
    border-top: 1px dashed var(--border);
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-muted);
}
.admin-icon-custom .admin-input { flex: 1 1 150px; }

/* --- 13ח. ייצוא, אישור ו-toast --- */
.admin-note {
    padding: 11px 13px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-right: 4px solid var(--gold);
    border-radius: var(--r-md);
    background: var(--surface-2);
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--text-muted);
}
.admin-note strong { color: var(--text); }

.admin-export-area {
    min-height: 260px;
    font-family: 'Courier New', monospace;
    font-size: 0.76rem;
    line-height: 1.5;
    direction: ltr;
    text-align: left;
    resize: vertical;
}

.admin-confirm {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: min(520px, calc(100vw - 40px));
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--red);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-lg);
}
.admin-confirm-text {
    flex: 1;
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
}
.admin-confirm-actions { display: flex; gap: 6px; flex-shrink: 0; }

.admin-toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translate(-50%, 14px);
    z-index: 6000;
    padding: 11px 20px;
    border-radius: 40px;
    background: var(--text);
    color: var(--bg);
    font-family: 'Heebo', system-ui, sans-serif;
    font-size: 0.86rem;
    font-weight: 800;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
}
.admin-toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
.admin-toast-error {
    background: var(--red);
    color: #fff;
    max-width: min(520px, calc(100vw - 32px));
    text-align: center;
    line-height: 1.4;
    border-radius: var(--r-md);
}

.admin-btn:disabled {
    opacity: 0.6;
    cursor: progress;
}
        .admin-modal {
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            box-shadow: 0 40px 80px -20px rgb(0 0 0 / 0.6) !important;
        }
        .admin-root, .admin-root * { font-family: Inter, Heebo, system-ui, sans-serif; }
        .admin-root .material-symbols-outlined { font-family: "Material Symbols Outlined"; }
        .admin-root .fas { font-family: "Font Awesome 6 Free"; }

    <!--
        תאריך תפוגת מנוי - subscription.js הוא הקובץ היחיד שעורכים (מוסיפים שנה).
        subscription_guard.js מציג מסך "נא לחדש מנוי" כשהתאריך הגיע.
        נטענים ב-head כדי שהדשבורד לא יהבהב לפני שהוא מוסתר.
    -->
    <script src="subscription.js"></script>
    <script src="subscription_guard.js"></script>
</head>

<body class="dark-mode font-sans">

    <!-- מחיל את ערכת הצבעים השמורה מיד, לפני שהתוכן מצטייר (מונע הבזק צבע) -->
    <script>
        (function () {
            var saved;
            try { saved = localStorage.getItem("dashboard-theme"); } catch (e) {}
            var classes = {
                gold:     "theme-gold",
                royal:    "theme-royal",
                lime:     "theme-lime",
                petrol:   "theme-petrol",
                nordic:   "theme-nordic",
                sand:     "theme-sand",
                day:      "theme-day"
            };
            // מזהה חסר או ישן (steel / emerald / mono / bordeaux) → זהב קלאסי, ברירת המחדל
            document.body.classList.add(classes[saved] || "theme-gold");
            // ערכות בהירות - בלי dark-mode
            if (saved === "day" || saved === "nordic" || saved === "sand") document.body.classList.remove("dark-mode");
        })();
    </script>

    <!-- נגן אחד לשני המקורות (גלגלצ / מוזיקת הבית) - ראו radio_script.js -->
    <audio id="lobby-audio" preload="none"></audio>

    <!-- קנבס פיקסלים קבוע (1280x720) - stage_scale.js מתאים אותו לכל מסך בסקייל אחיד -->
    <div id="tv-stage">
    <div class="flex h-full flex-col gap-4 p-5">

        <!-- ═══════════════════════════════════════════
             HEADER: שעון · תחזית 7 ימים · מזג אוויר נוכחי · כלים
             נתונים: open-meteo.com (ללא מפתח), מתעדכן כל 30 דקות
        ════════════════════════════════════════════ -->
        <header class="glass relative z-30 flex h-[128px] shrink-0 items-center rounded-2xl px-8">

            <!-- שעון ותאריך -->
            <div class="flex w-[300px] shrink-0 flex-col justify-center">
                <div id="time" class="tabular text-[84px] font-bold leading-none tracking-[-0.04em] text-ink">--:--</div>
                <div class="mt-3 flex items-center gap-2 text-[15px] font-medium text-muted">
                    <span class="h-1.5 w-1.5 rounded-full bg-accent"></span>
                    <span id="date">טוען...</span>
                </div>
            </div>

            <div class="mx-6 h-16 w-px shrink-0 bg-line/70"></div>

            <!-- תחזית 7 ימים - נבנית ע"י הסקריפט בתחתית -->
            <div id="forecast-container" class="grid flex-1 grid-cols-7 gap-1.5"></div>

            <div class="mx-6 h-16 w-px shrink-0 bg-line/70"></div>

            <!-- מיקום + טמפרטורה נוכחית -->
            <div class="flex shrink-0 items-center gap-4">
                <div class="flex flex-col items-start">
                    <div class="text-[19px] font-bold leading-tight text-ink">החלמונית 4</div>
                    <div class="mt-1 flex items-center gap-1.5 text-[13px] text-muted">
                        <i data-lucide="map-pin" class="h-3.5 w-3.5 text-accent"></i>
                        <span>ראשון לציון</span>
                        <span class="text-faint">·</span>
                        <span>קריית ראשון</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="main-weather-icon" class="text-accent"><i data-lucide="sun" class="h-9 w-9" stroke-width="1.5"></i></span>
                    <span class="main-temp tabular text-[40px] font-semibold leading-none tracking-tight text-ink">--°</span>
                </div>
            </div>

            <!-- כלים: ערכת צבעים + מצב ניהול -->
            <div class="relative mr-6 flex shrink-0 flex-col gap-2 border-r border-line/70 pr-6">
                <button type="button" id="theme-picker-btn" title="בחירת ערכת צבעים"
                        class="grid h-10 w-10 place-items-center rounded-xl border border-line/80 bg-ink/[0.03] text-muted transition-all duration-300 hover:border-accent/50 hover:bg-accent/10 hover:text-accent">
                    <i data-lucide="palette" class="h-[18px] w-[18px]"></i>
                </button>
                <button type="button" id="admin-btn" title="מצב ניהול - עריכת הודעות וסטטוס"
                        class="grid h-10 w-10 place-items-center rounded-xl border border-line/80 bg-ink/[0.03] text-muted transition-all duration-300 hover:border-accent/50 hover:bg-accent/10 hover:text-accent">
                    <i data-lucide="lock" class="h-[18px] w-[18px]"></i>
                </button>

                <!-- פאנל ערכות הצבעים -->
                <div id="theme-picker-panel"
                     class="absolute z-50 w-[300px] rounded-2xl border border-line/80 bg-card/95 p-3 shadow-2xl shadow-black/40 backdrop-blur-xl"
                     style="top: calc(100% + 30px); left: -12px;">
                    <div class="flex items-center justify-between px-2 pb-3 pt-1">
                        <div class="text-[13px] font-semibold text-ink">ערכת צבעים</div>
                        <i data-lucide="sparkles" class="h-4 w-4 text-accent"></i>
                    </div>
                    <div id="theme-picker-rows" class="flex flex-col gap-1" role="radiogroup" aria-label="ערכת צבעים"></div>
                </div>
            </div>
        </header>

        <!-- ═══════════════════════════════════════════
             MIDDLE: 3 עמודות
        ════════════════════════════════════════════ -->
        <main class="grid min-h-0 flex-1 grid-cols-3 gap-4">

            <!-- ─── עמודה 1: הודעות ועד בית ─── -->

    <script>
        window.UI = (function () {
            "use strict";

            function esc(str) {
                return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
                    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
                });
            }

            function icon(name, cls) {
                return '<i data-lucide="' + name + '" class="' + (cls || "") + '"></i>';
            }

            // מצייר את כל ה-<i data-lucide> שעוד לא צוירו (קריאה אחת לכמה שינויים רצופים).
            // setTimeout ולא requestAnimationFrame - rAF מושהה כשהדף מוסתר (מסך כבוי /
            // קיוסק ברקע) ואז האייקונים לא היו מצוירים
            var pending = false;
            function paint() {
                if (pending) return;
                pending = true;
                setTimeout(function () {
                    pending = false;
                    if (window.lucide) lucide.createIcons({ attrs: { "stroke-width": 1.75 } });
                }, 0);
            }

            return { esc: esc, icon: icon, paint: paint };
        })();
    </script>

    <!-- ═══════════════════════════════════════════
         מזג אוויר + שעון (במקום weather_script.js)
         API: open-meteo.com · לשינוי עיר: LAT / LON
    ════════════════════════════════════════════ -->
    <script>
    (function () {
        "use strict";
        var LAT = 31.97;
        var LON = 34.81;
        var DAYS_HE = ["יום א׳", "יום ב׳", "יום ג׳", "יום ד׳", "יום ה׳", "יום ו׳", "שבת"];

        // קוד WMO → אייקון Lucide
        function weatherIcon(code) {
            if (code === 0)                return "sun";
            if (code <= 3)                 return "cloud-sun";
            if (code === 45 || code === 48) return "cloud-fog";
            if (code >= 51 && code <= 57)  return "cloud-drizzle";
            if (code >= 61 && code <= 67)  return "cloud-rain";
            if (code >= 71 && code <= 77)  return "snowflake";
            if (code >= 80 && code <= 82)  return "cloud-rain";
            if (code >= 95)                return "cloud-lightning";
            return "cloud";
        }

        function cell(i, day, iconName, temp) {
            var today = i === 0;
            return '' +
                '<div class="forecast-item flex flex-col items-center justify-center gap-2 rounded-xl py-3 transition-all duration-300 ' +
                    (today ? 'bg-accent/10 ring-1 ring-inset ring-accent/25' : 'hover:bg-ink/[0.04]') + '">' +
                    '<span class="fc-day text-[12px] font-medium ' + (today ? 'text-accent' : 'text-muted') + '">' + day + '</span>' +
                    UI.icon(iconName, "fc-icon h-6 w-6 " + (today ? "text-accent" : "text-ink/80")) +
                    '<span class="fc-temp tabular text-[16px] font-semibold text-ink">' + temp + '</span>' +
                '</div>';
        }

        // תאריך מקומי בפורמט של open-meteo (YYYY-MM-DD)
        function isoDay(d) {
            return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        }

        // מתחילים מהשורה של היום בפועל - כך גם תחזית שמורה מאתמול מוצגת בימים הנכונים
        function renderForecast(data) {
            var box = document.getElementById("forecast-container");
            if (!box) return;
            var now = new Date();
            var offset = data && data.daily && data.daily.time ? data.daily.time.indexOf(isoDay(now)) : -1;
            var html = "";
            for (var i = 0; i < 7; i++) {
                var day = i === 0 ? "היום" : DAYS_HE[(now.getDay() + i) % 7];
                var j = offset + i;
                if (offset >= 0 && j < data.daily.time.length) {
                    html += cell(i, day, weatherIcon(data.daily.weathercode[j]),
                                 Math.round(data.daily.temperature_2m_max[j]) + "°");
                } else {
                    html += cell(i, day, "cloud", "--°");
                }
            }
            box.innerHTML = html;
            UI.paint();
        }

        function renderCurrent(data) {
            document.querySelector(".main-temp").textContent =
                Math.round(data.current_weather.temperature) + "°";
            document.getElementById("main-weather-icon").innerHTML =
                UI.icon(weatherIcon(data.current_weather.weathercode), "h-9 w-9");
        }

        // גיבוי: התחזית האחרונה שהצליחה נשמרת ב-localStorage ומוצגת כשאין רשת,
        // כדי שתקלת אינטרנט קצרה לא תשאיר את הלובי עם "--°"
        var CACHE_KEY = "weather-cache";
        var CACHE_MAX_AGE = 3 * 24 * 60 * 60 * 1000;   // תחזית בת יותר מ-3 ימים כבר לא שווה כלום
        var CURRENT_MAX_AGE = 3 * 60 * 60 * 1000;      // "עכשיו" ישן מ-3 שעות - לא מציגים
        var REFRESH_MS = 30 * 60 * 1000;                // רענון רגיל - כל 30 דקות
        var RETRY_MS = 2 * 60 * 1000;                   // אחרי כישלון - ניסיון חוזר תוך 2 דקות
        var timer = null;

        function saveCache(data) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: data })); } catch (e) {}
        }

        function showCache() {
            try {
                var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
                if (!c || !c.data || Date.now() - c.ts > CACHE_MAX_AGE) return false;
                if (Date.now() - c.ts < CURRENT_MAX_AGE) renderCurrent(c.data);
                renderForecast(c.data);
                return true;
            } catch (e) { return false; }
        }

        function updateWeather() {
            clearTimeout(timer);
            var url = "https://api.open-meteo.com/v1/forecast" +
                      "?latitude=" + LAT + "&longitude=" + LON +
                      "&current_weather=true" +
                      "&daily=weathercode,temperature_2m_max" +
                      "&timezone=auto";
            fetch(url, { cache: "no-store" })
                .then(function (r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.json();
                })
                .then(function (data) {
                    renderCurrent(data);
                    renderForecast(data);
                    saveCache(data);
                    timer = setTimeout(updateWeather, REFRESH_MS);
                })
                .catch(function (err) {
                    console.error("שגיאה בטעינת מזג האוויר:", err);
                    showCache();
                    timer = setTimeout(updateWeather, RETRY_MS);
                });
        }

        function updateClock() {
            var now = new Date();
            var timeEl = document.getElementById("time");
            var dateEl = document.getElementById("date");
            if (timeEl) timeEl.textContent = now.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
            if (dateEl) dateEl.textContent = now.toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long" });
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (!showCache()) renderForecast(null);   // מציגים מיד את הגיבוי, עד שהרשת עונה
            updateClock();
            updateWeather();                          // מתזמן את עצמו: 30 דק׳, או 2 דק׳ אחרי כישלון
            setInterval(updateClock, 10000);          // שעון – כל 10 שניות
        });
    })();
    </script>

    <!-- ═══════════════════════════════════════════
         מועדים + זמני שבת (במקום Event_script.js)
         API: hebcal.com
    ════════════════════════════════════════════ -->
    <script>
    (function () {
        "use strict";
        var MONTH_NAMES = ["ינו׳", "פבר׳", "מרץ", "אפר׳", "מאי", "יוני",
                           "יולי", "אוג׳", "ספט׳", "אוק׳", "נוב׳", "דצמ׳"];
        var WEEKDAYS = ["יום ראשון", "יום שני", "יום שלישי", "יום רביעי", "יום חמישי", "יום שישי", "שבת"];

        var HOLIDAYS_URL = "https://www.hebcal.com/hebcal" +
                           "?v=1&cfg=json&maj=on&min=on&mod=on" +
                           "&year=now&month=all&lg=he";
        var SHABBAT_URL  = "https://www.hebcal.com/shabbat" +
                           "?cfg=json&geo=pos&latitude=31.9730&longitude=34.7925" +
                           "&tzid=Asia/Jerusalem&M=on&lg=he";

        function daysUntil(date) {
            var a = new Date(); a.setHours(0, 0, 0, 0);
            var b = new Date(date); b.setHours(0, 0, 0, 0);
            var d = Math.round((b - a) / 86400000);
            if (d <= 0) return "היום";
            if (d === 1) return "מחר";
            return "בעוד " + d + " ימים";
        }

        function eventCard(ev) {
            var d = new Date(ev.date);
            return '' +
                '<div class="event-card group flex items-center gap-4 rounded-xl border border-line/70 bg-ink/[0.02] px-3 py-2 transition-all duration-300 hover:border-accent/40 hover:bg-ink/[0.04]">' +
                    '<div class="flex w-[48px] shrink-0 flex-col overflow-hidden rounded-xl border border-line/80 bg-card text-center shadow-lg shadow-black/20">' +
                        '<span class="bg-accent/15 py-px text-[11px] font-semibold text-accent">' + MONTH_NAMES[d.getMonth()] + '</span>' +
                        '<span class="tabular py-0.5 text-[18px] font-bold leading-tight text-ink">' + d.getDate() + '</span>' +
                    '</div>' +
                    '<div class="min-w-0 flex-1">' +
                        '<h4 class="truncate text-[15px] font-semibold text-ink">' + UI.esc(ev.title) + '</h4>' +
                        '<p class="mt-0.5 text-[12px] text-muted">חג / מועד · ' + WEEKDAYS[d.getDay()] + '</p>' +
                    '</div>' +
                    '<span class="shrink-0 rounded-full border border-line/80 px-2.5 py-1 text-[11px] font-medium text-muted">' + daysUntil(d) + '</span>' +
                '</div>';
        }

        function fetchHebrewHolidays() {
            var box = document.getElementById("holidays-list");
            if (!box) return;
            fetch(HOLIDAYS_URL)
                .then(function (r) { if (!r.ok) throw new Error("שגיאת שרת"); return r.json(); })
                .then(function (data) {
                    var now = new Date();
                    var upcoming = data.items
                        .filter(function (item) { return new Date(item.date) >= now; })
                        .slice(0, 3);
                    box.innerHTML = upcoming.map(eventCard).join("") ||
                        '<p class="px-1 py-2 text-[14px] text-muted">אין מועדים קרובים</p>';
                })
                .catch(function (err) {
                    console.error("שגיאה בטעינת מועדים:", err);
                    box.innerHTML = '<p class="px-1 py-2 text-[14px] text-muted">שגיאה בטעינת מועדים</p>';
                });
        }

        function fmtTime(dateStr) {
            return new Date(dateStr).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
        }

        function timeBlock(iconName, label, value) {
            return '' +
                '<div class="flex flex-1 items-center gap-3 px-4 py-3">' +
                    '<div class="icon-tile h-9 w-9 bg-accent/10 text-accent">' + UI.icon(iconName, "h-[18px] w-[18px]") + '</div>' +
                    '<div class="flex flex-col">' +
                        '<span class="text-[12px] text-muted">' + label + '</span>' +
                        '<span class="tabular text-[22px] font-semibold leading-tight tracking-tight text-ink">' + value + '</span>' +
                    '</div>' +
                '</div>';
        }

        function fetchShabbatTimes() {
            var box = document.getElementById("shabbat-times");
            if (!box) return;
            fetch(SHABBAT_URL)
                .then(function (r) { if (!r.ok) throw new Error("שגיאת שרת"); return r.json(); })
                .then(function (data) {
                    var candles  = data.items.find(function (i) { return i.category === "candles"; });
                    var havdalah = data.items.find(function (i) { return i.category === "havdalah"; });
                    var parasha  = data.items.find(function (i) { return i.category === "parashat"; });
                    if (!candles || !havdalah) { box.innerHTML = ""; return; }

                    box.innerHTML = '' +
                        '<div class="shabbat-card mb-4 overflow-hidden rounded-xl border border-accent/25 bg-gradient-to-bl from-accent/[0.09] via-transparent to-transparent shadow-lg shadow-black/20">' +
                            '<div class="flex items-center gap-2 border-b border-accent/15 px-4 py-2.5">' +
                                UI.icon("moon-star", "h-4 w-4 text-accent") +
                                '<span class="text-[14px] font-semibold text-ink">שבת' + (parasha ? ' — ' + UI.esc(parasha.hebrew) : '') + '</span>' +
                            '</div>' +
                            '<div class="flex divide-x divide-x-reverse divide-accent/15">' +
                                timeBlock("flame", "כניסת שבת", fmtTime(candles.date)) +
                                timeBlock("sparkles", "צאת שבת", fmtTime(havdalah.date)) +
                            '</div>' +
                        '</div>';
                    UI.paint();
                })
                .catch(function (err) {
                    console.error("שגיאה בטעינת זמני שבת:", err);
                    box.innerHTML = "";
                });
        }

        document.addEventListener("DOMContentLoaded", fetchHebrewHolidays);
        document.addEventListener("DOMContentLoaded", fetchShabbatTimes);
    })();
    </script>

    <!-- ═══════════════════════════════════════════

         אם ההודעות לא נכנסות בגובה - גלילה רציפה במהירות קבועה
    ════════════════════════════════════════════ -->
    <script>
    window.DashboardNotices = (function () {
        "use strict";
        var PX_PER_SECOND = 24;
        var resizeObserver = null;

        function buildItem(notice) {
            var item = document.createElement("div");
            // אזהרה = מסגרת ענבר דקה ורקע רך, בלי בלוק צבעוני רווי
            var title = String(notice.title || "").replace(/^\s*⚠️?\s*/, "");
            if (notice.urgent) {
                item.className = "notice-item active-notice flex gap-3 rounded-xl border border-warn/30 bg-warn/[0.06] p-4";
                item.innerHTML =
                    '<div class="icon-tile h-8 w-8 bg-warn/10 text-warn">' + UI.icon("triangle-alert", "h-4 w-4") + '</div>' +
                    '<div class="min-w-0 flex-1">' +
                        '<h3 class="text-[15px] font-semibold leading-snug text-warn">' + UI.esc(title) + '</h3>' +
                        '<p class="mt-1 text-[13px] leading-relaxed text-ink/80">' + UI.esc(notice.body) + '</p>' +
                    '</div>';
            } else {
                item.className = "notice-item rounded-xl border border-line/70 bg-ink/[0.02] p-4 transition-all duration-300 hover:border-line hover:bg-ink/[0.04]";
                item.innerHTML =
                    '<h3 class="flex items-center gap-2 text-[15px] font-semibold leading-snug text-ink">' +
                        '<span class="h-1.5 w-1.5 shrink-0 rounded-full bg-accent/70"></span>' + UI.esc(title) +
                    '</h3>' +
                    '<p class="mt-1 pr-3.5 text-[13px] leading-relaxed text-muted">' + UI.esc(notice.body) + '</p>';
            }
            return item;
        }

        function render() {
            var container = document.getElementById("notices-list");
            if (!container || !window.AdminStore) return;

            if (resizeObserver) { resizeObserver.disconnect(); resizeObserver = null; }

            var notices = AdminStore.getNotices();
            container.innerHTML = "";
            container.classList.remove("has-scroll");
            var track = document.createElement("div");
            track.className = "notices-track";
            notices.forEach(function (n) { track.appendChild(buildItem(n)); });
            container.appendChild(track);
            UI.paint();

            // ResizeObserver בודק שוב בכל שינוי גובה אמיתי (פונטים/אייקונים נטענים
            // א-סינכרונית), עד שמתגלה גלישה - ואז עוברים לגלילה ומפסיקים לעקוב
            var converted = false;
            function checkOverflow() {
                if (converted) return;
                if (track.scrollHeight <= container.clientHeight) return;
                converted = true;

                // הפער (gap) נכלל כדי שהלולאה תהיה חלקה בלי קפיצה
                var singleSetHeight = track.scrollHeight + 10;
                notices.forEach(function (n) { track.appendChild(buildItem(n)); });
                UI.paint();

                track.style.setProperty("--notices-scroll-duration", (singleSetHeight / PX_PER_SECOND).toFixed(1) + "s");
                track.classList.add("is-scrolling");
                container.classList.add("has-scroll");

                if (resizeObserver) { resizeObserver.disconnect(); resizeObserver = null; }
            }

            if (typeof ResizeObserver !== "undefined") {
                resizeObserver = new ResizeObserver(checkOverflow);
                resizeObserver.observe(track);
                resizeObserver.observe(container);
            } else {
                window.addEventListener("load", function () { setTimeout(checkOverflow, 300); });
            }
            checkOverflow();
        }

        render();
        if (window.AdminStore) AdminStore.onChange(render);
        return { render: render };
    })();
    </script>

    <!-- ═══════════════════════════════════════════
         סטטוס בניין (במקום building_status_script.js)
         האדמין בוחר אייקונים בשמות Font Awesome - ממופים ל-Lucide;
         שם שלא במפה מוצג כאייקון Font Awesome כגיבוי.
    ════════════════════════════════════════════ -->
    <script>
    window.DashboardBuildingStatus = (function () {
        "use strict";

        var FA_TO_LUCIDE = {
            "trash-can": "trash-2", "trash-alt": "trash-2", "trash": "trash-2",
            "recycle": "recycle", "elevator": "arrow-up-down", "arrow-up": "arrow-up",
            "broom": "brush", "droplet": "droplet", "faucet": "droplets",
            "fire-extinguisher": "fire-extinguisher", "bolt": "zap", "lightbulb": "lightbulb",
            "plug": "plug", "wifi": "wifi", "car": "car", "bicycle": "bike", "key": "key-round",
            "door-open": "door-open", "wrench": "wrench", "screwdriver-wrench": "wrench",
            "hammer": "hammer", "paint-roller": "paint-roller", "envelope": "mail",
            "box": "package", "dog": "dog", "leaf": "leaf", "tree": "trees",
            "dumbbell": "dumbbell", "stairs": "chevrons-up", "video": "cctv",
            "shield-halved": "shield-half", "snowflake": "snowflake", "sun": "sun",
            "temperature-half": "thermometer", "calendar-days": "calendar-days",
            "phone": "phone", "users": "users", "file-invoice-dollar": "receipt",
            "building": "building-2", "truck": "truck", "circle-check": "circle-check",
            "triangle-exclamation": "triangle-alert"
        };

        // צבעי הסטטוס: ירוק רך = תקין, ענבר = דורש תשומת לב, אפור = ניטרלי
        var TONES = {
            good:    { tile: "bg-good/10 text-good ring-1 ring-inset ring-good/20",
                       row:  "border-good/25 bg-good/[0.04]",
                       value:"text-good font-semibold",
                       dot:  "bg-good" },
            warning: { tile: "bg-bad/10 text-bad ring-1 ring-inset ring-bad/20",
                       row:  "border-bad/30 bg-bad/[0.05]",
                       value:"text-bad font-bold",
                       dot:  "bg-bad" },
            "":      { tile: "bg-ink/[0.06] text-ink/75 ring-1 ring-inset ring-line/60",
                       row:  "border-line/70 bg-ink/[0.02]",
                       value:"text-muted font-medium",
                       dot:  "" }
        };

        function iconHtml(name) {
            var lucideName = FA_TO_LUCIDE[name];
            return lucideName
                ? UI.icon(lucideName, "h-5 w-5")
                : '<i class="fas fa-' + UI.esc(name) + ' text-[17px]"></i>';
        }

        function buildItem(entry) {
            var tone = TONES[entry.state] || TONES[""];
            var item = document.createElement("div");
            item.className = "status-item-mini group flex items-center gap-4 rounded-xl border px-3.5 py-3 transition-all duration-300 hover:bg-ink/[0.05] " +
                             tone.row + (entry.state === "good" ? " is-active" : "");
            item.innerHTML =
                '<div class="icon-tile h-11 w-11 ' + tone.tile + '">' + iconHtml(entry.icon) + '</div>' +
                '<div class="flex min-w-0 flex-1 flex-col">' +
                    '<span class="text-[12px] font-medium text-muted">' + UI.esc(entry.label) + '</span>' +
                    // ערך "תקין" / "אזהרה" מקבל את צבע הסטטוס
                    '<span class="mt-0.5 truncate text-[16px] ' + (entry.state ? tone.value : "font-semibold text-ink") + '">' + UI.esc(entry.value) + '</span>' +
                '</div>' +
                (tone.dot
                    ? '<span class="relative flex h-2.5 w-2.5 shrink-0"><span class="absolute inline-flex h-full w-full animate-ping rounded-full opacity-40 ' + tone.dot + '"></span><span class="relative inline-flex h-2.5 w-2.5 rounded-full ' + tone.dot + '"></span></span>'
                    : '');
            return item;
        }

        function render() {
            var container = document.getElementById("building-status-list");
            if (!container || !window.AdminStore) return;
            container.innerHTML = "";
            AdminStore.getStatus().forEach(function (entry) {
                container.appendChild(buildItem(entry));
            });
            UI.paint();
        }

        render();
        if (window.AdminStore) AdminStore.onChange(render);
        return { render: render };
    })();
    </script>

    <!-- ═══════════════════════════════════════════
         בוחר ערכות צבעים (במקום theme_picker.js) - נשמר ב-localStorage
    ════════════════════════════════════════════ -->
    <script>
    (function () {
        "use strict";
        var STORAGE_KEY = "dashboard-theme";
        var DEFAULT_THEME = "gold";

        // dots = הדגשה / משני / רקע - רק לתצוגה בפאנל
        var THEMES = [
            { id: "gold",     label: "זהב קלאסי",          cls: "theme-gold",     dots: ["#d4a84b", "#a1a1aa", "#09090b"] },
            { id: "royal",    label: "כחול מלכותי",        cls: "theme-royal",    dots: ["#6ea8ff", "#94a3b8", "#020617"] },
            { id: "lime",     label: "גרפיט וליים",        cls: "theme-lime",     dots: ["#bef264", "#9ca398", "#0a0b0a"] },
            { id: "petrol",   label: "פטרול",              cls: "theme-petrol",   dots: ["#35c4d8", "#8ea8af", "#030c0f"] },
            { id: "nordic",   label: "בוקר נורדי",         cls: "theme-nordic",   dots: ["#2563eb", "#475569", "#ecf1f7"], forceLight: true },
            { id: "sand",     label: "חול וטרקוטה",        cls: "theme-sand",     dots: ["#ba522c", "#6b6052", "#f4efe5"], forceLight: true },
            { id: "day",      label: "מצב יום - שמש חזקה", cls: "theme-day",      dots: ["#d97706", "#3f4752", "#ffffff"], forceLight: true }
        ];

        function store(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* מצב פרטי - לא קריטי */ }
        }
        function load(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function resolveId(id) {
            return THEMES.some(function (t) { return t.id === id; }) ? id : DEFAULT_THEME;
        }

        function applyTheme(id) {
            var theme = THEMES.filter(function (t) { return t.id === resolveId(id); })[0];
            THEMES.forEach(function (t) { document.body.classList.remove(t.cls); });
            document.body.classList.add(theme.cls);
            document.body.classList.toggle("dark-mode", !theme.forceLight);
            store(STORAGE_KEY, theme.id);
            renderPanel(theme.id);
        }

        function renderPanel(activeId) {
            var rows = document.getElementById("theme-picker-rows");
            if (!rows) return;
            rows.innerHTML = "";
            THEMES.forEach(function (theme) {
                var selected = theme.id === activeId;
                var row = document.createElement("button");
                row.type = "button";
                row.setAttribute("role", "radio");
                row.setAttribute("aria-checked", String(selected));
                row.className = "theme-swatch-row flex w-full items-center gap-3 rounded-xl border border-transparent px-3 py-2.5 text-right transition-all duration-300 hover:bg-ink/[0.05]" +
                                (selected ? " is-selected" : "");

                var dots = theme.dots.map(function (c, i) {
                    return '<span class="h-5 w-5 rounded-full ring-2 ring-card" style="background:' + c + ';' +
                           (i ? 'margin-inline-start:-7px;' : '') + 'box-shadow:inset 0 0 0 1px rgba(255,255,255,0.12)"></span>';
                }).join("");

                row.innerHTML =
                    '<span class="flex shrink-0 items-center">' + dots + '</span>' +
                    '<span class="flex-1 text-[14px] font-medium text-ink">' + UI.esc(theme.label) + '</span>' +
                    '<span class="theme-radio"></span>';
                row.addEventListener("click", function (e) {
                    e.stopPropagation();
                    applyTheme(theme.id);
                });
                rows.appendChild(row);
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            var btn   = document.getElementById("theme-picker-btn");
            var panel = document.getElementById("theme-picker-panel");
            if (!btn || !panel) return;

            applyTheme(resolveId(load(STORAGE_KEY)));

            btn.addEventListener("click", function (e) {
                e.stopPropagation();
                panel.classList.toggle("is-open");
            });
            document.addEventListener("click", function (e) {
                if (!panel.contains(e.target) && !btn.contains(e.target)) panel.classList.remove("is-open");
            });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") panel.classList.remove("is-open");
            });
        });
    })();
    </script>

    <!-- ═══════════════════════════════════════════
         קודי QR (עמודת "הודעות ועד בית")

         ✏️ עריכה: כל שורה ב-QR_CODES = קוד אחד. מומלץ עד 3 קודים.
           label - הכותרת שמתחת/ליד הקוד
           url   - הקישור - הקוד נוצר ממנו אוטומטית (לא צריך קובץ תמונה)
           image - לחלופין: קובץ תמונה מוכן של QR (כמו קבוצת הוואטסאפ)
           sub   - שורת משנה (מוצגת רק כשיש קוד אחד)

         הסדר ברשימה = הסדר על המסך מימין לשמאל.

         ⚠️ כרגע שלושת הקודים מובילים זמנית ל-google.com -
            להחליף בקישורי ההזמנה האמיתיים (PayBox / וואטסאפ).
    ════════════════════════════════════════════ -->
    <!-- מ-unpkg (כמו Lucide) - cdnjs חסום בחלק מהרשתות -->
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    <script>
    (function () {
        "use strict";

        var QR_CODES = [
            { label: "קבוצת תשלום PayBox",        url: "https://www.google.com" },   // ⚠️ זמני - להחליף בקישור PayBox
            { label: "קבוצת וואצאפ - דיירים",     url: "https://www.google.com" },   // ⚠️ זמני - להחליף בקישור הוואטסאפ
            { label: "קבוצת וואצאפ - בעלי דירה", url: "https://www.google.com" }    // ⚠️ זמני - להחליף בקישור הוואטסאפ
        ];

        function qrImage(entry) {
            if (entry.image) {
                return '<img src="' + UI.esc(entry.image) + '" alt="QR - ' + UI.esc(entry.label) + '">';
            }
            if (entry.url && window.qrcode) {
                var qr = qrcode(0, "M");           // 0 = גודל אוטומטי לפי אורך הקישור
                qr.addData(entry.url);
                qr.make();
                return qr.createSvgTag({ cellSize: 2, margin: 0, scalable: true });
            }
            return "";
        }

        function render() {
            var box = document.getElementById("qr-codes");
            if (!box) return;
            var list = QR_CODES.filter(function (e) { return e.image || e.url; });
            if (!list.length) { box.innerHTML = ""; return; }

            var multi = list.length > 1;
            box.innerHTML =
                '<div class="qr-grid' + (multi ? ' is-multi' : '') + '" style="grid-template-columns:repeat(' + list.length + ',minmax(0,1fr))">' +
                list.map(function (e) {
                    return '<div class="qr-tile">' +
                               '<div class="qr-img">' + qrImage(e) + '</div>' +
                               '<div class="min-w-0">' +
                                   '<div class="qr-label">' + UI.esc(e.label) + '</div>' +
                                   (e.sub ? '<div class="qr-sub">' + UI.icon("scan-line") + UI.esc(e.sub) + '</div>' : '') +
                               '</div>' +
                           '</div>';
                }).join("") +
                '</div>';
            UI.paint();
        }

        render();
    })();
    </script>

    <script>
        // ציור ראשוני של כל אייקוני ה-Lucide הסטטיים
        UI.paint();
    </script>
